<div class="head">
    <div class="head-text">
        <h2 class="title">{{lang.educationTitle}}</h2>
    </div>
</div>
<ul class="jobs">
    <li *ngFor="let degree of lang.degrees" class="job">
        <div class="job-main">
            <h3>{{degree.title}}</h3>
            <p>{{degree.institution}}</p>
            <div *ngIf="degree.note" class="tags"><span class="tag">{{degree.note}}</span></div>
        </div>
        <div class="job-when">
            <span class="period">{{degree.years}}</span>
        </div>
    </li>
</ul>
<img class="art-corner" src="assets/img/art-education.webp" alt="" width="720" height="538">
