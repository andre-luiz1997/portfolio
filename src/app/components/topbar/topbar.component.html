<section class="topbar">
    <p-toolbar styleClass="topbar-toolbar px-8 py-5">
        <ng-template #start>
            <nav class="flex">
                <a href="#aboutMe" class="item">{{lang.about_me}}</a>
                <a href="#skills" class="item">{{lang.experiences}}</a>
                <a href="#education" class="item">{{lang.education}}</a>
            </nav>
        </ng-template>
        <ng-template #end>
            <button type="button" (click)="languagePopover.toggle($event)" class="language-trigger">
                <span class="flag-icon" [ngClass]="langIcon !== undefined ? langIcon : '' "></span>
            </button>
            <p-popover #languagePopover styleClass="language-popover">
                <div class="flex flex-column gap-2">
                    <button *ngFor="let language of availableLanguages" (click)="switchLanguage(language.lang); languagePopover.hide()" class="language-option flag-icon {{language.icon}}"></button>
                </div>
            </p-popover>
        </ng-template>
    </p-toolbar>
</section>
